<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chart</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h6>Il tuo Carrello</h6>
    <div class="chart">
      <div class="chart-left">
        <div class="banner">
          <div class="banner-icon">
            <img src="/assets/bell.png" alt="bell">
          </div>
          <div class="banner-right">
            <h2>Attenzione</h2>
            <p>Controlla attentamente il tuo indirizzo di spedizione. Non potrai modificarlo successivamente.</p>
          </div>
        </div>
        <a href="/index.html">Torna al Catalogo</a>
        <div id="prodotti-chart"><p>Nessun prodotto presente</p></div>
      </div>
      <div>
        <h6>Totale carrello</h6>
        <p id="total">0 euro</p>
        <button id="acquista" disabled>Acquista</button>
      </div>
    </div>
    <script src="chart.js"></script>
  </body>
</html>
