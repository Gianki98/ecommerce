<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body>
    <form action="" id="formLogin">
      <label for="usernameEmail">Email o Username</label>
      <input
        type="text"
        name="usernameEmail"
        required
        placeholder="Inserisci qui la tua email o il tuo username"
      />
      <label for="psw">Password</label>
      <input
        type="password"
        name="psw"
        id="psw"
        required
        placeholder="Inserisci Password"
      />
      <button type="submit">Login</button>
    </form>
    <script src="/login.js"></script>
  </body>
</html>
